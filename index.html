<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p id="event-date" class="info">15 ноября, 18:30</p>
      <p id="event-place" class="info">Музей космонавтики, проспект Мира, 111</p>
      <p id="event-description" class="info">Вечерняя программа с выставкой и экскурсиями</p>

      <button id="show-program" class="button" type="button">Показать программу</button>
      <div id="program" class="program" hidden></div>
    </section>

    <p id="data-error" class="error" hidden>Ошибка данных.</p>

    <form id="service-form" class="card form" hidden>
      <h2>Дополнительные услуги</h2>

      <label class="option">
        <input id="guide" type="checkbox" name="guide">
        Экскурсия с гидом — 500 руб.
      </label>
      <label class="option">
        <input id="audio" type="checkbox" name="audio">
        Аудиогид — 350 руб.
      </label>
      <label class="option">
        <input id="catalog" type="checkbox" name="catalog">
        Каталог выставки — 250 руб.
      </label>

      <button class="button" type="submit">Рассчитать</button>

      <p id="choice-error" class="error" hidden>Выберите хотя бы одну услугу.</p>
      <p id="result" class="result" hidden></p>
      <pre id="report-json" class="json" hidden></pre>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
